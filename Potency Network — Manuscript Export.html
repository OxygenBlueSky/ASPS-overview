<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><title>Potency Network — Manuscript Export</title>
<style>
  .ms-root {
    display: inline-flex;

    gap: 18px;

  .edge.thick    { stroke-width: 3.5; }

  .node circle { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
  .node text { fill: #000000; font-size: 13px; font-weight: 600; text-anchor: middle; }

  .ms-legend { display: flex; flex-direction: column; gap: 9px; font-size: 12px; color: #000000; white-space: nowrap; }
  .ms-legend-headline { font-size: 12px; font-weight: 700; margin: 0 0 2px; }
  .ms-legend-item { display: flex; align-items: center; gap: 7px; }
  .ms-swatch { width: 22px; height: 2px; border-radius: 1px; flex-shrink: 0; }
  .ms-swatch-svg { flex-shrink: 0; display: block; }

</head><body><div class="ms-root">
  <svg width="355" height="394" viewBox="0 0 355 394" role="img" aria-label="Potency significance network, either measure">
    <g id="edges"><line x1="213.37306695894642" y1="71" x2="267.93266739736606" y2="102.50000000000001" class="edge sig-none"></line><line x1="198" y1="86.37306695894642" x2="283.3057343563125" y2="234.12693304105358" class="edge sig-mp"></line><line x1="177" y1="92" x2="177" y2="302" class="edge sig-none"></line><line x1="156" y1="86.37306695894642" x2="70.69426564368752" y2="234.12693304105358" class="edge sig-both"></line><line x1="140.62693304105358" y1="71" x2="86.06733260263395" y2="102.49999999999999" class="edge sig-rr thick"></line><line x1="304.3057343563125" y1="165.5" x2="304.3057343563125" y2="228.5" class="edge sig-both thick"></line><line x1="283.3057343563125" y1="159.87306695894642" x2="198" y2="307.6269330410536" class="edge sig-rr"></line><line x1="267.93266739736606" y1="144.5" x2="86.06733260263394" y2="249.5" class="edge sig-both thick"></line><line x1="262.3057343563125" y1="123.50000000000001" x2="91.69426564368753" y2="123.49999999999999" class="edge sig-rr thick"></line><line x1="267.93266739736606" y1="291.5" x2="213.37306695894642" y2="323" class="edge sig-mp"></line><line x1="262.3057343563125" y1="270.5" x2="91.69426564368752" y2="270.5" class="edge sig-none"></line><line x1="267.93266739736606" y1="249.5" x2="86.06733260263395" y2="144.5" class="edge sig-rr"></line><line x1="140.62693304105358" y1="323" x2="86.06733260263394" y2="291.5" class="edge sig-mp"></line><line x1="156" y1="307.6269330410536" x2="70.69426564368753" y2="159.87306695894642" class="edge sig-rr"></line><line x1="49.69426564368752" y1="228.5" x2="49.69426564368752" y2="165.5" class="edge sig-none"></line></g>
    <g id="nodes"><g class="node"><circle cx="177" cy="50" r="42"></circle><text x="177" y="54">Ars.Album</text></g><g class="node"><circle cx="304.3057343563125" cy="123.50000000000001" r="42"></circle><text x="304.3057343563125" y="127.50000000000001">Lactose</text></g><g class="node"><circle cx="304.3057343563125" cy="270.5" r="42"></circle><text x="304.3057343563125" y="274.5">Mercury</text></g><g class="node"><circle cx="177" cy="344" r="42"></circle><text x="177" y="348">Silicea</text></g><g class="node"><circle cx="49.694265643687515" cy="270.5" r="42"></circle><text x="49.694265643687515" y="274.5">Stannum</text></g><g class="node"><circle cx="49.69426564368753" cy="123.49999999999999" r="42"></circle><text x="49.69426564368753" y="127.49999999999999">Sulphur</text></g></g>
  </svg>
  <div class="ms-legend" id="legend"><div class="ms-legend-headline">Significance driven by:</div><div class="ms-legend-item"><svg class="ms-swatch-svg" width="24" height="8"><line x1="1" x2="23" y1="4" y2="4" stroke="#FFC72C" stroke-width="2"></line></svg><span>Maximum Probability</span></div><div class="ms-legend-item"><svg class="ms-swatch-svg" width="24" height="8"><line x1="1" x2="23" y1="4" y2="4" stroke="#00BD5F" stroke-width="2"></line></svg><span>Root/Sprout Ratio</span></div><div class="ms-legend-item"><svg class="ms-swatch-svg" width="24" height="8"><line x1="1" x2="23" y1="4" y2="4" stroke="#E7298A" stroke-width="2"></line></svg><span>Both</span></div><div class="ms-legend-item"><svg class="ms-swatch-svg" width="24" height="8"><line x1="1" x2="23" y1="4" y2="4" stroke="#a8a8a8" stroke-width="2" stroke-dasharray="3 4"></line></svg><span>Not significant</span></div><div class="ms-legend-item"><svg class="ms-swatch-svg" width="24" height="8"><line x1="1" x2="23" y1="4" y2="4" stroke="#000000" stroke-width="3.5"></line></svg><span>Thick = p &lt; 0.01</span></div></div>
</div>

<script>
(function () {
  const nodes = ['Ars.Album', 'Lactose', 'Mercury', 'Silicea', 'Stannum', 'Sulphur'];

  // fixed criterion: Potency, either measure
  const edgesData = [
    { a: 'Ars.Album', b: 'Lactose',  mp: 0.2839, rr: 0.4226 },
    { a: 'Ars.Album', b: 'Mercury',  mp: 0.0335, rr: 0.2088 },
    { a: 'Ars.Album', b: 'Silicea',  mp: 0.6762, rr: 0.0914 },
    { a: 'Ars.Album', b: 'Stannum',  mp: 0.0428, rr: 0.0201 },
    { a: 'Ars.Album', b: 'Sulphur',  mp: 0.4284, rr: 0.0002 },
    { a: 'Lactose',   b: 'Mercury',  mp: 0.0015, rr: 0.0401 },
    { a: 'Lactose',   b: 'Silicea',  mp: 0.5127, rr: 0.0132 },
    { a: 'Lactose',   b: 'Stannum',  mp: 0.0021, rr: 0.0018 },
    { a: 'Lactose',   b: 'Sulphur',  mp: 0.0636, rr: 0.0000 },
    { a: 'Mercury',   b: 'Silicea',  mp: 0.0111, rr: 0.6640 },
    { a: 'Mercury',   b: 'Stannum',  mp: 0.9191, rr: 0.2915 },
    { a: 'Mercury',   b: 'Sulphur',  mp: 0.1835, rr: 0.0134 },
    { a: 'Silicea',   b: 'Stannum',  mp: 0.0147, rr: 0.5394 },
    { a: 'Silicea',   b: 'Sulphur',  mp: 0.2275, rr: 0.0431 },
    { a: 'Stannum',   b: 'Sulphur',  mp: 0.2190, rr: 0.1563 },
  ];

  const sig = v => v < 0.05;
  const strong = v => v < 0.01;

  // ---- layout: tight hexagon, no dead canvas space ----
  // R shrunk ~20% from the prior version; r (node radius), font-size, and
  // stroke-width are untouched so text and line weight read identically
  const cx = 177, cy = 197, R = 147, r = 42;
  const pos = {};
  nodes.forEach((name, i) => {
    const angle = (-90 + i * 60) * Math.PI / 180;
    pos[name] = { x: cx + R * Math.cos(angle), y: cy + R * Math.sin(angle) };
  });

  const svgNS = 'http://www.w3.org/2000/svg';
  const edgesG = document.getElementById('edges');
  const nodesG = document.getElementById('nodes');

  edgesData.forEach(e => {
    const p1 = pos[e.a], p2 = pos[e.b];
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const ux = dx / dist, uy = dy / dist;

    const mp = sig(e.mp), rr = sig(e.rr);
    const isSig = mp || rr;
    const driver = !isSig ? 'none' : (mp && rr) ? 'both' : (mp ? 'mp' : 'rr');
    const thick = (mp && strong(e.mp)) || (rr && strong(e.rr));

    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', p1.x + ux * r);
    line.setAttribute('y1', p1.y + uy * r);
    line.setAttribute('x2', p2.x - ux * r);
    line.setAttribute('y2', p2.y - uy * r);
    line.setAttribute('class', `edge sig-${driver}${thick ? ' thick' : ''}`);
    edgesG.appendChild(line);
  });

  nodes.forEach(name => {
    const p = pos[name];
    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'node');
    const circle = document.createElementNS(svgNS, 'circle');
    circle.setAttribute('cx', p.x); circle.setAttribute('cy', p.y); circle.setAttribute('r', r);
    const text = document.createElementNS(svgNS, 'text');
    text.setAttribute('x', p.x); text.setAttribute('y', p.y + 4);
    text.textContent = name;
    g.appendChild(circle); g.appendChild(text);
    nodesG.appendChild(g);
  });

  // ---- legend, to the right — each swatch is a real SVG line so dash
  // patterns match the graph's edges exactly (a CSS border-dash renders
  // differently from an SVG stroke-dasharray) ----
  const legendItems = [
    { stroke: '#FFC72C', width: 2,   dash: null,   label: 'Maximum Probability' },
    { stroke: '#00BD5F', width: 2,   dash: null,   label: 'Root/Sprout Ratio' },
    { stroke: '#E7298A', width: 2,   dash: null,   label: 'Both' },
    { stroke: '#a8a8a8', width: 2,   dash: '3 4',  label: 'Not significant' },
    { stroke: '#000000', width: 3.5, dash: null,   label: 'Thick = p < 0.01' },
  ];
  const legend = document.getElementById('legend');
  const headline = document.createElement('div');
  headline.className = 'ms-legend-headline';
  headline.textContent = 'Significance driven by:';
  legend.appendChild(headline);
  legendItems.forEach(it => {
    const row = document.createElement('div');
    row.className = 'ms-legend-item';

    const swSvg = document.createElementNS(svgNS, 'svg');
    swSvg.setAttribute('class', 'ms-swatch-svg');
    swSvg.setAttribute('width', 24);
    swSvg.setAttribute('height', 8);
    const swLine = document.createElementNS(svgNS, 'line');
    swLine.setAttribute('x1', 1); swLine.setAttribute('x2', 23);
    swLine.setAttribute('y1', 4); swLine.setAttribute('y2', 4);
    swLine.setAttribute('stroke', it.stroke);
    swLine.setAttribute('stroke-width', it.width);
    if (it.dash) swLine.setAttribute('stroke-dasharray', it.dash);
    swSvg.appendChild(swLine);

    const lbl = document.createElement('span');
    lbl.textContent = it.label;
    row.appendChild(swSvg); row.appendChild(lbl);
    legend.appendChild(row);
  });
})();
</script>
</body></html>
